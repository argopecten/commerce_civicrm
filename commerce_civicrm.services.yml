# This file defines the services provided by the Commerce CiviCRM module.
services:

  ### Event Subscribers
  # Routes commerce_order.post_transition events to CiviCRM processing based
  # on the configured create/cancel transition IDs.
  commerce_civicrm.order_complete_subscriber:
    class: Drupal\commerce_civicrm\EventSubscriber\OrderCompleteSubscriber
    arguments:
      - '@logger.factory'
      - '@commerce_civicrm.order_civicrm_updater'
      - '@config.factory'
    tags:
      - { name: event_subscriber }

  ### Services for CiviCRM integration used by direct Commerce integration

  # Orchestrator: resolves order items into directives and creates CiviCRM
  # records through the Order API (one contribution per Commerce order).
  commerce_civicrm.order_civicrm_updater:
    class: Drupal\commerce_civicrm\Service\OrderCivicrmUpdater
    arguments:
      - '@logger.factory'
      - '@commerce_civicrm.civicrm_helper'
      - '@commerce_civicrm.contact_updater'
      - '@commerce_civicrm.contribution_updater'
      - '@commerce_civicrm.membership_updater'
      - '@commerce_civicrm.mailing_updater'
      - '@commerce_civicrm.participant_updater'
      - '@event_dispatcher'
      - '@config.factory'
      - '@datetime.time'

  # Records renewal payments (recurring charges without an order transition)
  # for already-processed orders. Site code calls recordRenewalPayment().
  commerce_civicrm.renewal_processor:
    class: Drupal\commerce_civicrm\Service\RenewalProcessor
    arguments:
      - '@logger.factory'
      - '@commerce_civicrm.civicrm_helper'
      - '@commerce_civicrm.order_civicrm_updater'
      - '@commerce_civicrm.contribution_updater'
      - '@event_dispatcher'

  # Contact resolution (UFMatch, match-or-create fallback) and option lists.
  commerce_civicrm.contact_updater:
    class: Drupal\commerce_civicrm\Service\ContactUpdater
    arguments:
      - '@entity_type.manager'
      - '@logger.factory'
      - '@commerce_civicrm.civicrm_helper'

  # Contribution lookups, payment instrument mapping and cancellation.
  commerce_civicrm.contribution_updater:
    class: Drupal\commerce_civicrm\Service\ContributionUpdater
    arguments:
      - '@entity_type.manager'
      - '@logger.factory'
      - '@commerce_civicrm.civicrm_helper'
      - '@config.factory'

  # Membership lookups and cancellation.
  commerce_civicrm.membership_updater:
    class: Drupal\commerce_civicrm\Service\MembershipUpdater
    arguments:
      - '@entity_type.manager'
      - '@logger.factory'
      - '@commerce_civicrm.civicrm_helper'

  # Mailing group subscriptions.
  commerce_civicrm.mailing_updater:
    class: Drupal\commerce_civicrm\Service\MailingUpdater
    arguments:
      - '@entity_type.manager'
      - '@logger.factory'
      - '@commerce_civicrm.civicrm_helper'

  # Participant cancellation for event products.
  commerce_civicrm.participant_updater:
    class: Drupal\commerce_civicrm\Service\ParticipantUpdater
    arguments:
      - '@logger.factory'
      - '@commerce_civicrm.civicrm_helper'

  # CiviCRM bootstrap, availability checks, custom-field provisioning and
  # cached name-to-ID lookups.
  commerce_civicrm.civicrm_helper:
    class: Drupal\commerce_civicrm\Service\CivicrmHelper
    arguments:
      - '@logger.factory'
      - '@module_handler'
      - '@?civicrm'

  # CiviCRM settings section on Commerce product edit forms.
  commerce_civicrm.product_form_helper:
    class: Drupal\commerce_civicrm\Service\ProductFormHelper
    arguments:
      - '@logger.factory'
      - '@commerce_civicrm.civicrm_helper'
      - '@commerce_civicrm.membership_updater'
      - '@commerce_civicrm.contact_updater'
