# This file defines the services provided by the Commerce CiviCRM module.
services:

  ### Event Subscribers
  # Commerce-style direct integration event subscriber.
  # Handles order workflow transitions and creates CiviCRM records automatically.
  commerce_civicrm.order_complete_subscriber:
    class: Drupal\commerce_civicrm\EventSubscriber\OrderCompleteSubscriber
    arguments: 
      - '@logger.factory'
      - '@commerce_civicrm.order_civicrm_updater'
    tags:
      - { name: event_subscriber }

  ### Services for CiviCRM integration used by direct Commerce integration
  # These services provide CiviCRM API access and are used by:
  # 1. OrderCivicrmUpdater for automatic order processing
  # 2. Custom extensions for additional CiviCRM operations

  # Service for processing Commerce orders and creating CiviCRM records
  # This is the main service that coordinates order processing
  commerce_civicrm.order_civicrm_updater:
    class: Drupal\commerce_civicrm\Service\OrderCivicrmUpdater
    arguments:
      - '@logger.factory'
      - '@commerce_civicrm.civicrm_helper'
      - '@commerce_civicrm.contact_updater'
      - '@commerce_civicrm.contribution_updater'
      - '@commerce_civicrm.membership_updater'
      - '@commerce_civicrm.mailing_updater'
    tags:
      - { name: service }

  # Service for updating CiviCRM contacts based on Commerce Order data
  commerce_civicrm.contact_updater:
    class: Drupal\commerce_civicrm\Service\ContactUpdater
    arguments: 
      - '@entity_type.manager'
      - '@logger.factory'
      - '@commerce_civicrm.civicrm_helper'
    tags:
      - { name: service }

  # Service for updating CiviCRM contributions based on Commerce Order data
  commerce_civicrm.contribution_updater:
    class: Drupal\commerce_civicrm\Service\ContributionUpdater
    arguments:
      - '@entity_type.manager'
      - '@logger.factory'
      - '@commerce_civicrm.civicrm_helper'
    tags:
      - { name: service }

  # Service for updating CiviCRM memberships based on Commerce Order data
  commerce_civicrm.membership_updater:
    class: Drupal\commerce_civicrm\Service\MembershipUpdater
    arguments:
      - '@entity_type.manager'
      - '@logger.factory'
      - '@commerce_civicrm.civicrm_helper'
    tags:
      - { name: service }

  # Service for updating CiviCRM mailing group subscriptions
  commerce_civicrm.mailing_updater:
    class: Drupal\commerce_civicrm\Service\MailingUpdater
    arguments:
      - '@entity_type.manager'
      - '@logger.factory'
      - '@commerce_civicrm.civicrm_helper'
    tags:
      - { name: service }

  # Service for CiviCRM helper functions, initialization, and availability checks
  commerce_civicrm.civicrm_helper:
    class: Drupal\commerce_civicrm\Service\CivicrmHelper
    arguments:
      - '@logger.factory'
      - '@module_handler'
      - '@?civicrm'
    tags:
      - { name: service }

  # Service for handling CiviCRM settings on Commerce product edit forms
  commerce_civicrm.product_form_helper:
    class: Drupal\commerce_civicrm\Service\ProductFormHelper
    arguments:
      - '@logger.factory'
      - '@commerce_civicrm.civicrm_helper'
      - '@commerce_civicrm.membership_updater'
      - '@commerce_civicrm.contact_updater'
