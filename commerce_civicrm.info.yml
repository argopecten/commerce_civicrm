name: 'Commerce CiviCRM'
type: module
description: 'Integrates Drupal Commerce with CiviCRM, allowing products to be mapped to CiviCRM memberships or contributions.'
package: Commerce
core_version_requirement: ^11
dependencies:
  - civicrm:civicrm
  - drupal:commerce_product
  - drupal:commerce_order
  - drupal:commerce_payment
  - drupal:user
  - drupal:profile
  - drupal:state_machine
config:
  install:
    - views.view.commerce_civicrm_my_orders
